services:
  db:
    image: postgres:17-alpine
    container_name: agent_mark_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mark_app
      POSTGRES_PASSWORD: mark_app_password
      POSTGRES_DB: agent_mark
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Seed role + grants on first init (also handled idempotently by migrations)
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mark_app -d agent_mark"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

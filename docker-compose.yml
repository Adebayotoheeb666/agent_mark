services:
  db:
    image: postgres:17-alpine
    container_name: agent_mark_db
    restart: unless-stopped
    # School-hardware proxy (verification finding 2026-09-28): N2 performance
    # results on an unconstrained DB are meaningless. Still not real hardware,
    # but far closer than defaults.
    cpus: 1
    mem_limit: 1g
    environment:
      POSTGRES_USER: mark_app
      POSTGRES_PASSWORD: mark_app_password
      POSTGRES_DB: agent_mark
      # App-login password, single-sourced from .env (MARK_API_PASSWORD).
      # The entrypoint script and migration 004 read this same value.
      MARK_API_PASSWORD: ${MARK_API_PASSWORD:-mark_api_password}
    ports:
      # Loopback-only (verification finding 2026-09-28): 0.0.0.0:5432 exposed
      # Postgres — and its superuser default password — to the whole LAN,
      # bypassing the API guard and the role split. Verify closed with
      # ss -tlnp | grep 5432 (must show 127.0.0.1) or from a second device.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Seed role + grants on first init (also handled idempotently by migrations)
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mark_app -d agent_mark"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

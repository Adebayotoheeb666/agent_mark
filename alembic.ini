[alembic]
script_location = migrations
# OWNER connection (mark_app): migrations need DDL/superuser. The app runtime
# uses the least-privilege mark_api URL from .env / app config instead.
sqlalchemy.url = postgresql+psycopg2://mark_app:mark_app_password@localhost:5432/agent_mark

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
